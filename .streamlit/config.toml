[theme]
paddingTop = "0.5rem"
font = "sans serif"

[theme.light]
primaryColor = "#1D3557"
backgroundColor = "#FAFAF7"
secondaryBackgroundColor = "#E8EEF4"
textColor = "#142B45"
borderColor = "#D4DDE7"
chartCategoricalColors = ["#1D3557", "#D6A23C", "#567FA8", "#9A6E3A"]

[theme.dark]
primaryColor = "#1D3557"
backgroundColor = "#101A27"
secondaryBackgroundColor = "#1E2B3A"
